<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Queue Token h Test</title>

<style>
  body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .box {
    max-width: 700px;
    margin: auto;
    background: #1c1c1e;
    border-radius: 16px;
    padding: 20px;
    box-sizing: border-box;
  }

  h1 {
    font-size: 20px;
    margin-top: 0;
  }

  .token {
    word-break: break-all;
    background: #000;
    padding: 14px;
    border-radius: 10px;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  .label {
    color: #aaa;
    margin-top: 18px;
    margin-bottom: 6px;
  }

  .value {
    background: #2c2c2e;
    padding: 10px;
    border-radius: 8px;
    font-family: monospace;
    word-break: break-all;
  }

  .ok {
    color: #30d158;
    font-weight: bold;
  }

  button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #0a84ff;
    color: white;
    font-size: 16px;
  }
</style>
</head>

<body>

<div class="box">

<h1>Queue Token h Test</h1>

<div class="label">テスト用 queueittoken</div>

<div id="token" class="token"></div>

<div class="label">h detected</div>
<div id="detected" class="value"></div>

<div class="label">h value</div>
<div id="hvalue" class="value"></div>

<div class="label">h length</div>
<div id="length" class="value"></div>

<div class="label">h character class</div>
<div id="class" class="value"></div>

<button onclick="runTest()">再テスト</button>

</div>

<script>

const TEST_TOKEN =
  "e_test~ts_1760000000~q_testqueue~rt_afterevent~ec_1~h_TESTSIGNATURE123456";

function parseQueueTokenDisplay(token) {

  const raw = String(token || "");

  const out = {
    e: "",
    ts: "",
    q: "",
    rt: "",
    ec: "",
    h: "[署名値あり]",
    hValue: "",
    hLength: 0,
    hCharacterClass: "unknown",
    other: []
  };

  for (const part of raw.split("~")) {

    const idx = part.indexOf("_");

    if (idx <= 0) continue;

    const key = part.slice(0, idx);
    const value = part.slice(idx + 1);

    if (
      key === "e" ||
      key === "ts" ||
      key === "q" ||
      key === "rt" ||
      key === "ec"
    ) {

      out[key] = value.slice(0, 200);

    } else if (key === "h") {

      out.h = "[署名値あり]";

      // テスト用なのでダミーhを取得
      out.hValue = value;

      out.hLength = value.length;

      out.hCharacterClass =
        /^[0-9]+$/.test(value)
          ? "numeric"
          : /^[0-9a-f]+$/i.test(value)
            ? "hexadecimal"
            : "mixed/other";

    } else {

      out.other.push(key);

    }
  }

  return out;
}


function runTest() {

  const p = parseQueueTokenDisplay(TEST_TOKEN);

  document.getElementById("token").textContent =
    TEST_TOKEN;

  document.getElementById("detected").innerHTML =
    p.hLength > 0
      ? '<span class="ok">YES</span>'
      : "NO";

  document.getElementById("hvalue").textContent =
    p.hValue || "[なし]";

  document.getElementById("length").textContent =
    p.hLength;

  document.getElementById("class").textContent =
    p.hCharacterClass;
}


runTest();

</script>

</body>
</html>
